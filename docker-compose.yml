# ============================================================
# 🐌 SlugTube — Self-Hosted YouTube Archiver
# ============================================================
# Quick start:
#   1. Copy .env.example to .env and set your paths
#   2. docker compose up -d
#   3. Open http://localhost:5000
# ============================================================

services:
  slugtube:
    build: .
    container_name: slugtube
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      - FAST_CRON=${FAST_CRON:-0 */6 * * *}
      - FULL_CRON=${FULL_CRON:-0 3 * * 0}
      - UPDATE_CRON=${UPDATE_CRON:-0 1 * * *}
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      # Your media library (where videos are stored)
      - ${SHOWS_DIR:?Set SHOWS_DIR in .env}:/shows
      # SlugTube config (database, cookies, archive, logs)
      - ${CONFIG_DIR:?Set CONFIG_DIR in .env}:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
