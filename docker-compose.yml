# ============================================================
# SlugTube - YouTube Archive Manager
# ============================================================
# Start:   docker compose up -d
# Stop:    docker compose down
# Logs:    docker compose logs -f
# Web UI:  http://localhost:5000
# Update:  Run update.bat (git pull + restart)
# ============================================================

services:
  slugtube:
    build: .
    container_name: slugtube
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FAST_CRON=0 */6 * * *
      - FULL_CRON=0 3 * * 0
      - UPDATE_CRON=0 1 * * *
      - TZ=America/New_York          # Change to your timezone (e.g. America/Phoenix, Europe/London)
      - PUID=1000
      - PGID=1000
    volumes:
      # Your media library — change to your media path
      - /path/to/your/media:/shows
      # SlugTube config, cookies, archive, logs, database
      - ./data:/config
      # Live code mount — code runs directly from repo
      - ./scripts:/app/scripts
      - ./web:/app/web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
