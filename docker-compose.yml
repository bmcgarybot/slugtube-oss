# ============================================================
# SlugTube - Homemade PinchFlat (With Dashboard)
# ============================================================
# Start:   docker compose up -d
# Stop:    docker compose down
# Logs:    docker compose logs -f
# Web UI:  http://localhost:5000
# Update:  Run update.bat (git pull + restart)
# ============================================================

services:
  slugtube:
    build: C:/SlugTube-new
    container_name: slugtube
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FAST_CRON=0 */6 * * *
      - FULL_CRON=0 3 * * 0
      - UPDATE_CRON=0 1 * * *
      - TZ=America/Phoenix
      - PUID=1000
      - PGID=1000
    volumes:
      # Your media library
      - G:/Youtube/shows:/shows
      # SlugTube config, cookies, archive, logs, database
      - C:/SlugTube:/config
      # Live code mount — points straight at the git repo, no copy needed
      - C:/SlugTube-new/scripts:/app/scripts
      - C:/SlugTube-new/web:/app/web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
